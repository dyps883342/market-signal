name: Market Signal Cloud
run-name: MarketSignal manual ${{ inputs.request_id || 'github-ui' }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Browser refresh request ID (optional)
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: market-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: app/data
          key: market-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: market-data-
      - name: Update market data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $app = Join-Path $root 'app'
          $dashboard = Join-Path $app 'dashboard.html'
          & (Join-Path $app 'update.ps1') -Silent
          Set-Location -LiteralPath $root
          if (!(Test-Path -LiteralPath $dashboard)) { throw "Dashboard missing: $dashboard" }
          $html = Get-Content -LiteralPath $dashboard -Raw -Encoding UTF8
          if ($html -notmatch 'class=.groupoverview' -or !(Test-Path (Join-Path $app 'data/TWII.csv')) -or !(Test-Path (Join-Path $app 'data/GSPC.csv'))) { throw 'Incomplete market data; existing website retained' }
          $site = Join-Path $root 'site'
          New-Item -ItemType Directory -Force $site | Out-Null
          Copy-Item -LiteralPath $dashboard -Destination (Join-Path $site 'index.html')
      - uses: actions/cache/save@v5
        with:
          path: app/data
          key: market-data-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
